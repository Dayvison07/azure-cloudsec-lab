name: "DevSecOps - IaC Security Gate & Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write 
  contents: read
  

jobs:
  security-scan:
    name: "Checkov SAST & Compliance"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Security Gate
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/dev
          framework: terraform
          output_format: cli
          soft_fail: false # Bloqueia o pipeline se encontrar vulnerabilidades
          download_external_modules: true

  terraform-build:
    name: "Terraform Lint & Validation"
    needs: security-scan # Só roda se o Checkov aprovar 100%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
 
  terraform-apply:
    name: "Terraform Apply (OIDC)"
    needs: [security-scan, terraform-build] # Só provisiona se passar na segurança e sintaxe
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        run: terraform init 

      - name: Terraform Apply
        run: terraform apply -auto-approve

    
