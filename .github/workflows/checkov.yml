name: "DevSecOps - IaC Security Gate & Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write # Permissao necessaria para enviar relatorios SARIF para a aba Security

jobs:
  security-scan:
    name: "Checkov SAST & Compliance"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Security Gate (SARIF Report)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/dev
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false # Bloqueia se houver falha critica
          download_external_modules: true

      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Garante envio do relatorio mesmo se o scan quebrar o pipeline
        with:
          sarif_file: results.sarif

  terraform-build:
    name: "Terraform Lint & Validation"
    needs: security-scan # So executa se a esteira de seguranca passar 100%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false # Valida plugins sem exigir conexao remota

      - name: Terraform Validate
        run: terraform validate